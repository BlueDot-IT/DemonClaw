name: refresh-lockfile

on:
  push:
    branches: ['fix/demonclaw-security-hygiene']
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Refresh Wasmtime lock entries
        run: |
          set -euo pipefail
          cargo update -p wasmtime --precise 46.0.2
          cargo update -p wasmtime-wasi --precise 46.0.2
          cargo check --locked --all-targets

      - name: Commit updated lockfile
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi

          test -n "$ORG_SYNC_TOKEN"
          git config user.name "DemonClaw CI"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh lockfile for Wasmtime 46.0.2"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/demonclaw-security-hygiene
