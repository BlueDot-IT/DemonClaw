name: ci

on:
  push:
    branches: [main, org-sync, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, org-sync]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: demonclaw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d demonclaw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres@localhost:5433/demonclaw
      DEMONCLAW_TOKEN: ci-operator-smoke-token
      DEMONCLAW_REQUIRE_ENGAGEMENT: '0'
      RUST_BACKTRACE: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: wasm32-wasip1

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build WASM payloads for end-to-end tests
        run: cargo build --locked --manifest-path payloads/test_payload/Cargo.toml --target wasm32-wasip1 --release

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all

      - name: Exercise migrations and operator CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- migrate
          cargo run --locked -- doctor
          cargo run --locked -- target add ci-local --local --tag ci
          cargo run --locked -- target list | grep -F 'ci-local'
          cargo run --locked -- findings list
          cargo run --locked -- version | grep -F 'demonclaw 1.1.0'

      - name: Exercise daemon and stable v1 API
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- run >/tmp/demonclaw-ci.log 2>&1 &
          daemon_pid=$!
          cleanup() {
            kill "$daemon_pid" 2>/dev/null || true
            wait "$daemon_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat /tmp/demonclaw-ci.log
            exit 1
          fi

          cargo run --locked -- status | grep -F '"registered_targets": 1'
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/targets | grep -F 'ci-local'
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/findings >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/evidence/verify | grep -F '"is_valid":true'

          unauth_status="$(curl --silent --show-error -o /tmp/unauthorized-ingest.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"content":"memory:compact"}' \
            http://127.0.0.1:3000/api/v1/ingest)"
          if [[ "$unauth_status" == 2* ]]; then
            cat /tmp/unauthorized-ingest.json
            echo 'unauthenticated ingest unexpectedly succeeded' >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H 'content-type: application/json' \
            -H "x-demonclaw-token: ${DEMONCLAW_TOKEN}" \
            -d '{"content":"memory:compact"}' \
            http://127.0.0.1:3000/api/v1/ingest >/dev/null

          cargo run --locked -- doctor
