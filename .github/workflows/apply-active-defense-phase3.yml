name: apply-active-defense-phase3

on:
  push:
    branches: ['feat/active-defense-phase3']
    paths:
      - .github/workflows/apply-active-defense-phase3.yml
      - .github/scripts/apply-phase3.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Apply Phase 3 implementation
        run: python3 .github/scripts/apply-phase3.py

      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all

      - name: Commit verified Phase 3 changes
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORG_SYNC_TOKEN"
          rm -f .github/workflows/apply-active-defense-phase3.yml .github/scripts/apply-phase3.py
          git config user.name "DemonClaw CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(active-defense): add persistent baseline and drift monitoring"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/feat/active-defense-phase3
