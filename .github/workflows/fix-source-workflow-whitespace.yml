name: repair-source-hardening-whitespace

on:
  push:
    branches: ['fix/demonclaw-security-hygiene']
    paths:
      - .github/workflows/fix-source-workflow-whitespace.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Upgrade replacement matching and self-delete
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/source-hardening.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          import_line = next(
              index for index, line in enumerate(lines)
              if line.strip() == 'from pathlib import Path'
          )
          lines.insert(import_line, lines[import_line][:-len(lines[import_line].lstrip())] + 'import re')

          start = next(
              index for index, line in enumerate(lines)
              if line.strip() == 'def replace_once(path: str, old: str, new: str) -> None:'
          )
          end = next(
              index for index in range(start + 1, len(lines))
              if lines[index].strip().startswith('def replace_all(')
          )
          prefix = lines[start][:-len(lines[start].lstrip())]
          body = prefix + '    '
          replacement = [
              prefix + 'def replace_once(path: str, old: str, new: str) -> None:',
              body + 'text = read(path)',
              body + 'count = text.count(old)',
              body + 'if count == 1:',
              body + '    write(path, text.replace(old, new, 1))',
              body + '    return',
              body + 'parts = re.split(r"(\\s+)", old)',
              body + 'pattern = "".join(',
              body + '    r"\\s+" if part.isspace() else re.escape(part)',
              body + '    for part in parts',
              body + '    if part',
              body + ')',
              body + 'matches = list(re.finditer(pattern, text, flags=re.MULTILINE))',
              body + 'if len(matches) != 1:',
              body + '    raise RuntimeError(',
              body + '        f"{path}: expected one semantic match, found {len(matches)}: {old!r}"',
              body + '    )',
              body + 'match = matches[0]',
              body + 'write(path, text[:match.start()] + new + text[match.end():])',
              '',
          ]
          lines[start:end] = replacement

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/fix-source-workflow-whitespace.yml
          git config user.name "DemonClaw Security Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci: make source hardening semantic matching whitespace tolerant"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/demonclaw-security-hygiene
