          #[tokio::main]
          async fn main() -> Result<()> {
              dotenvy::dotenv().ok();

              let cfg = DemonClawConfig::load()?;
              if cfg.security.ingest_auth_enabled {
                  let token = std::env::var(&cfg.security.ingest_token_env).with_context(|| {
