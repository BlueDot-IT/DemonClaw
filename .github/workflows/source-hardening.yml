name: apply-source-hardening

on:
  push:
    branches: ['fix/demonclaw-security-hygiene']
    paths:
      - .github/workflows/source-hardening.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-source-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1

      - name: Apply source-level hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count == 1:
                  write(path, text.replace(old, new, 1))
                  return
              parts = re.split(r"(\s+)", old)
              pattern = "".join(
                  r"\s+" if part.isspace() else re.escape(part)
                  for part in parts
                  if part
              )
              matches = list(re.finditer(pattern, text, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise RuntimeError(
                      f"{path}: expected one semantic match, found {len(matches)}: {old!r}"
                  )
              match = matches[0]
              write(path, text[:match.start()] + new + text[match.end():])

          def replace_all(path: str, old: str, new: str, minimum: int = 1) -> None:
              text = read(path)
              count = text.count(old)
              if count < minimum:
                  raise RuntimeError(f"{path}: expected at least {minimum} matches, found {count}: {old!r}")
              write(path, text.replace(old, new))

          def replace_section(path: str, start: str, end: str, replacement: str) -> None:
              text = read(path)
              start_index = text.find(start)
              if start_index < 0:
                  raise RuntimeError(f"{path}: missing section start {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise RuntimeError(f"{path}: missing section end {end!r}")
              write(path, text[:start_index] + replacement + text[end_index:])

