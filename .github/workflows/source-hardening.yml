      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all

      - name: Check repository credential hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(MYSQL_ROOT_PASSWORD|POSTGRES_PASSWORD):[[:space:]]+[^$]|postgres://[^/@:]+:[^/@]+@|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+' -- ':!CHANGELOG.md'; then
            echo "::error::Potential committed credential literal detected."
            exit 1
          fi

      - name: Commit verified fixes and remove temporary workflows
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORG_SYNC_TOKEN"
          rm -f .github/workflows/source-hardening.yml .github/workflows/lockfile-refresh.yml .github/workflows/fix-source-workflow-*.yml
          git config user.name "DemonClaw Security Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: fail closed and enforce runtime trust boundaries"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/demonclaw-security-hygiene
