name: repair-source-hardening-yaml

on:
  push:
    branches: ['fix/demonclaw-security-hygiene']
    paths:
      - .github/workflows/fix-source-workflow-yaml.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repair embedded Python indentation
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/source-hardening.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(
              index for index, line in enumerate(lines)
              if line.strip() == 'pattern = "".join('
          )
          end = next(
              index for index in range(start + 1, len(lines))
              if lines[index].strip().startswith('matches = list(')
          )
          replacement = [
              '              pattern = "".join(',
              '                  (',
              '                      r"\\s+"',
              '                      if "\\n" in part or "\\r" in part',
              '                      else r"[ \\t]+"',
              '                  )',
              '                  if part.isspace()',
              '                  else re.escape(part)',
              '                  for part in parts',
              '                  if part',
              '              )',
          ]
          lines[start:end] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/fix-source-workflow-yaml.yml
          git config user.name "DemonClaw Security Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci: repair source hardening workflow indentation"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/demonclaw-security-hygiene
