name: apply-productization-core

on:
  push:
    branches: ['feat/productization-core']
    paths:
      - .github/workflows/apply-productization-core.yml
      - .github/scripts/apply-productization-core.py
      - .github/scripts/fix-productization-tests.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: demonclaw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d demonclaw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres@localhost:5433/demonclaw
      DEMONCLAW_TOKEN: ci-productization-token
      DEMONCLAW_REQUIRE_ENGAGEMENT: '0'
      RUST_BACKTRACE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Apply productization core
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-productization-core.py
          python3 .github/scripts/fix-productization-tests.py

      - name: Build test payload
        run: cargo build --locked --manifest-path payloads/test_payload/Cargo.toml --target wasm32-wasip1 --release

      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all

      - name: Exercise migrations and operator CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- migrate
          cargo run --locked -- doctor
          cargo run --locked -- target add ci-local --local --tag ci
          cargo run --locked -- target list | grep -F 'ci-local'
          cargo run --locked -- findings list
          cargo run --locked -- version

      - name: Commit verified productization core
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORG_SYNC_TOKEN"
          rm -f \
            .github/workflows/apply-productization-core.yml \
            .github/scripts/apply-productization-core.py \
            .github/scripts/fix-productization-tests.py
          git config user.name "DemonClaw CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add operator CLI and persistent operational state"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/feat/productization-core
