name: repair-channels-section-boundary

on:
  push:
    branches: ['fix/demonclaw-security-hygiene']
    paths:
      - .github/workflows/fix-source-workflow-channels.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Correct section boundary and self-delete
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/source-hardening.yml')
          text = path.read_text(encoding='utf-8')
          old = '    "\\n}\\n\\nasync fn ingest_handler(",\n'
          new = '    "\\n\\nasync fn ingest_handler(",\n'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one channels boundary, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/fix-source-workflow-channels.yml
          git config user.name "DemonClaw Security Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci: correct channels section replacement boundary"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/demonclaw-security-hygiene
