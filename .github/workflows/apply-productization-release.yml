name: apply-productization-release

on:
  push:
    branches: ['feat/productization-core']
    paths:
      - .github/workflows/apply-productization-release.yml
      - .github/scripts/apply-productization-release.py
      - .github/scripts/fix-productization-release.py
      - .github/scripts/fix-api-v1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: wasm32-wasip1

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Apply distribution changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-productization-release.py
          python3 .github/scripts/fix-productization-release.py
          python3 .github/scripts/fix-api-v1.py

      - name: Refresh root lock metadata
        run: cargo check

      - name: Verify Rust release state
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all
          cargo build --locked --release
          ./target/release/demonclaw version | grep -F 'demonclaw 1.1.0'

      - name: Verify installer and release bundle shape
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/install.sh
          package=demonclaw-1.1.0-linux-x86_64
          mkdir -p "dist/${package}/packaging/systemd"
          install -m 0755 target/release/demonclaw "dist/${package}/demonclaw"
          cp -a templates migrations "dist/${package}/"
          install -m 0755 packaging/install.sh "dist/${package}/packaging/install.sh"
          install -m 0644 packaging/demonclaw.env.example "dist/${package}/packaging/demonclaw.env.example"
          install -m 0644 packaging/systemd/demonclaw.service "dist/${package}/packaging/systemd/demonclaw.service"
          cp README.md CONFIG.md SUPPORT.md SECURITY_MODEL.md UPGRADING.md CHANGELOG.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"
          tar -tzf "dist/${package}.tar.gz" | grep -F "${package}/demonclaw"
          tar -tzf "dist/${package}.tar.gz" | grep -F "${package}/templates/dashboard.html"
          tar -tzf "dist/${package}.tar.gz" | grep -F "${package}/packaging/install.sh"
          sha256sum "dist/${package}.tar.gz"

      - name: Generate validation SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/demonclaw-1.1.0-linux-x86_64.tar.gz
          format: spdx-json
          output-file: dist/demonclaw-1.1.0-linux-x86_64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Verify SBOM output
        run: test -s dist/demonclaw-1.1.0-linux-x86_64.spdx.json

      - name: Build and smoke Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t demonclaw:productization-test .
          docker run --rm demonclaw:productization-test version | grep -F 'demonclaw 1.1.0'

      - name: Scan workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input zizmor==1.29.0
          zizmor .github/workflows

  validate-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Apply distribution changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-productization-release.py
          python3 .github/scripts/fix-productization-release.py
          python3 .github/scripts/fix-api-v1.py

      - name: Build native ARM64 release
        shell: bash
        run: |
          set -euo pipefail
          cargo check
          cargo build --locked --release
          test "$(uname -m)" = "aarch64"
          ./target/release/demonclaw version | grep -F 'demonclaw 1.1.0'

  commit:
    needs: [validate-x64, validate-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Apply verified distribution changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-productization-release.py
          python3 .github/scripts/fix-productization-release.py
          python3 .github/scripts/fix-api-v1.py
          cargo check

      - name: Commit verified distribution layer
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORG_SYNC_TOKEN"
          rm -f \
            .github/workflows/apply-productization-release.yml \
            .github/scripts/apply-productization-release.py \
            .github/scripts/fix-productization-release.py \
            .github/scripts/fix-api-v1.py
          git config user.name "DemonClaw CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "release: productize DemonClaw 1.1.0 distribution"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/feat/productization-core
