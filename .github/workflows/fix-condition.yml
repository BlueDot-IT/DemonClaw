name: fix-final-condition
on:
  push:
    branches: ['fix/demonclaw-security-hygiene']
    paths: ['.github/workflows/fix-condition.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/source-hardening.yml')
          s = p.read_text()
          a = "              if let Some(user) = user {\n                  if user.is_empty()"
          b = "              if let Some(user) = user\n                  && (user.is_empty()"
          c = "                          .all(|byte| byte.is_ascii_alphanumeric() || matches!(byte, b'.' | b'_' | b'-'))\n                  {\n                      bail!(\"Invalid SSH user name\");\n                  }\n              }"
          d = "                          .all(|byte| byte.is_ascii_alphanumeric() || matches!(byte, b'.' | b'_' | b'-')))\n              {\n                  bail!(\"Invalid SSH user name\");\n              }"
          if s.count(a) != 1 or s.count(c) != 1:
              raise SystemExit('unexpected match count')
          p.write_text(s.replace(a, b, 1).replace(c, d, 1))
          PY
          rm .github/workflows/fix-condition.yml
          git config user.name "DemonClaw CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci: satisfy Clippy for user validation"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/demonclaw-security-hygiene
