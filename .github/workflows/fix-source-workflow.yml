name: correct-source-hardening-workflow

on:
  push:
    branches: ['fix/demonclaw-security-hygiene']
    paths:
      - .github/workflows/fix-source-workflow.yml

permissions:
  contents: read

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Correct Python escape sequences and self-delete
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/source-hardening.yml')
          text = path.read_text(encoding='utf-8')

          old = r'out.push_str("\n…(truncated)…\n");'
          new = r'out.push_str("\\n…(truncated)…\\n");'
          if text.count(old) != 2:
              raise RuntimeError(f'expected two truncation escape matches, found {text.count(old)}')
          text = text.replace(old, new)

          old = r"let forbidden = ['|', '&', ';', '>', '<', '`', '$', '\n', '\r'];"
          new = r"let forbidden = ['|', '&', ';', '>', '<', '`', '$', '\\n', '\\r'];"
          if text.count(old) != 1:
              raise RuntimeError(f'expected one forbidden-character escape match, found {text.count(old)}')
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/fix-source-workflow.yml
          git config user.name "DemonClaw Security Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci: correct source hardening escape guards"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/demonclaw-security-hygiene
