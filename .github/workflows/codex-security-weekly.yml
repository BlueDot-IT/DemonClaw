name: Codex Security weekly scan

on:
  schedule:
    - cron: "11 6 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codex-security-weekly
  cancel-in-progress: true

jobs:
  codex-security:
    name: Codex Security
    permissions:
      actions: read
      contents: read
    uses: BlueDot-IT/odinn-maintainer/.github/workflows/codex-security-daily.yml@e3bbd817f1bdf93df06c41da31a33eb5f9f0eb6e # reusable-v2
    with:
      target_repository: ${{ github.repository }}
      target_ref: ${{ github.event.repository.default_branch }}
    secrets:
      ODINN_OPENAI_OAUTH_JSON: ${{ secrets.ODINN_OPENAI_OAUTH_JSON }}
      ODINN_SECURITY_ARTIFACT_KEY: ${{ secrets.ODINN_SECURITY_ARTIFACT_KEY }}
