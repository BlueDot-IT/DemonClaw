name: fix-source-workflow-credential-scan

on:
  push:
    branches: ['fix/demonclaw-security-hygiene']
    paths:
      - .github/workflows/fix-source-workflow-credential-scan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exclude the temporary hardening workflow from its self-scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/source-hardening.yml')
          text = path.read_text(encoding='utf-8')
          old = "-- ':!CHANGELOG.md'; then"
          new = "-- ':!CHANGELOG.md' ':!.github/workflows/source-hardening.yml'; then"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one scanner pathspec, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit workflow fix
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORG_SYNC_TOKEN"
          git config user.name "DemonClaw CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/source-hardening.yml
          git commit -m "ci: prevent credential scanner self-match"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/demonclaw-security-hygiene
