name: fix-final-source-hardening

on:
  push:
    branches: ['fix/demonclaw-security-hygiene']
    paths:
      - .github/workflows/fix-source-workflow-final.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update source hardening verification
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/source-hardening.yml')
          text = path.read_text(encoding='utf-8')

          rust_step = "\n".join([
              "      - name: Install Rust",
              "        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable",
              "        with:",
              "          components: clippy, rustfmt",
              "          targets: wasm32-wasip1",
              "",
          ])
          cache_step = "\n".join([
              "      - name: Restore Rust cache",
              "        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2",
              "",
          ])
          if 'Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6' not in text:
              if text.count(rust_step) != 1:
                  raise RuntimeError('expected one Rust installation step')
              text = text.replace(rust_step, rust_step + cache_step, 1)

          test_anchor = '          replace_all("tests/sandbox_test.rs", "can_exec: false", "can_exec: vec![]")\n'
          assertion_patch = "\n".join([
              "          replace_once(",
              "              \"tests/sandbox_test.rs\",",
              "              \"    assert!(!manifest.can_exec);\\\\n\",",
              "              \"    assert!(manifest.can_exec.is_empty());\\\\n\",",
              "          )",
              "",
          ])
          if assertion_patch not in text:
              if text.count(test_anchor) != 1:
                  raise RuntimeError('expected one sandbox test migration anchor')
              text = text.replace(test_anchor, test_anchor + assertion_patch, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/fix-source-workflow-final.yml
          git config user.name "DemonClaw Security Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci: complete executable allowlist test migration"
          test -n "$ORG_SYNC_TOKEN"
          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/demonclaw-security-hygiene
